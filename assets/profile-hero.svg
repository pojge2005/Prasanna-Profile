  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb86c"/><stop offset="1" stop-color="#e655a5"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15264c"/><stop offset="1" stop-color="#090d19"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6ff"/><stop offset="1" stop-color="#7b8dae"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2fe7ff" stop-opacity=".5"/><stop offset="1" stop-color="#2fe7ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#02040d" flood-opacity=".6"/></filter>
</defs>
