<text x="54" y="77" fill="#60dcff" font-size="20" font-weight="700" letter-spacing="5">ENGINEER • BUILDER • DREAMER</text>
<text x="50" y="151" fill="#ffffff" font-size="58" font-weight="800">PRASANNA</text>
<text x="53" y="203" fill="#c7c9ff" font-size="30" font-weight="600">Poigey</text>
<rect x="54" y="228" width="354" height="2" fill="#8c63ff"/>
<text x="55" y="261" fill="#e9edff" font-size="19">Embedded systems, IoT, robotics</text>
<text x="55" y="290" fill="#e9edff" font-size="19">and software made for the real world.</text>
<g font-size="13" font-weight="700">
<rect x="54" y="319" width="90" height="32" rx="16" fill="#312165" stroke="#9c75ff"/><text x="99" y="340" text-anchor="middle" fill="#eee8ff">+ BUILD</text>
