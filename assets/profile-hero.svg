<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Prasanna Poigey — Engineering imagination into reality</title>
<desc id="desc">Original anime-inspired young developer with dark spiky hair and a blue-lit robot in a neon engineering studio at sunset.</desc>
<defs>
